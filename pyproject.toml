[project]
name = "sat-wms"
description = "A WMS for satellite data"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "psycopg[pool]",
    "jinja2",
    "donfig>=0.8.1.post1",
    "rio-tiler>=9.0.4",
    "morecantile>=7.0",
    "h2>=4.3.0",
    "shapely>=2.1.2",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "rasterio>=1.5.0",
    "trollsift>=1.0.0",
]
scripts = [
    "trollsift>=0.5",
    "rasterio>=1.5.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sat_wms"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/sat_wms/version.py"

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules/
select = ["A", "B", "D", "E", "W", "F", "I", "N", "PT", "S", "TID", "C90", "Q", "T10", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D103"]  # assert allowed in tests; no docstrings required
"src/sat_wms/pg_mda.py" = ["S608"]  # envelope_sql is a hardcoded fragment, not user input
"src/sat_wms/version.py" = ["D100", "I001", "Q000"]  # automatically generated by hatch-vcs
"scripts/*" = ["T201", "T20", "D103", "D301"]  # scripts use print and informal docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10
